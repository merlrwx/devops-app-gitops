apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend
  - frontend

namespace: devops-app
namePrefix: dev-

images:
  - name: backend
    newName: ghcr.io/merlrwx/devops-app-api
    newTag: dev
  - name: frontend
    newName: ghcr.io/merlrwx/devops-app-web
    newTag: dev
