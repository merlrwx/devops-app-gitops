apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/frontend

patches:
  - target:
      kind: Deployment
      name: frontend
      namespace: devops-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: BACKEND_URL
            value: "http://prod-backend:22112"
